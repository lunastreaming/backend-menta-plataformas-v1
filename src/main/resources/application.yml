spring:
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: dev
  application:
    name: mentaplataformas
  server:
    port: 8080
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cors:
    allowed-origins: http://localhost:3000

app:
  jwt:
    secret: "Z2VuZXJhdGVkLXJhbmRvbS1zZWNyZXQtdGVzdC1iYXNlNjQ="
    validity-ms: 43200000


whatsapp:
  service-url: "https://localhost:3001/instance/send-otp"
  instance-id: "mentaplataformas"

---
spring:
  config:
    activate:
      on-profile: prod
  application:
    name: mentaplataformas
  server:
    port: 8080
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cors:
    allowed-origins:
      - https://mentaplataformas.com
      - https://www.mentaplataformas.com

app:
  jwt:
    secret: ${JWT_SECRET}
    validity-ms: 43200000

whatsapp:
  service-url: ${WHATSAPP_SERVICE_URL:http://localhost:3000/instance/send-otp}
  instance-id: ${WHATSAPP_INSTANCE_ID:mi-primer-bot}